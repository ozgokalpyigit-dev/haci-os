<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hacı Orbit</title>
<style>
  :root { --ink:#050505; --paper:#f4f4f4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--ink); overflow:hidden; color:var(--paper);
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif; user-select:none; -webkit-user-select:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #stage { position:fixed; inset:0; }
  .clock { position:absolute; top:max(env(safe-area-inset-top),14px); left:0; right:0; text-align:center; pointer-events:none; }
  .clock .t { font-size:15px; letter-spacing:.32em; font-weight:300; text-indent:.32em; opacity:.92; }
  .clock .d { font-size:10px; letter-spacing:.42em; text-indent:.42em; margin-top:6px; opacity:.45; text-transform:uppercase; }
  .orbit { position:absolute; left:0; top:0; width:0; height:0; }
  .app { position:absolute; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #1c1c1c 0%, #060606 70%);
    border:1px solid rgba(255,255,255,.55); box-shadow:0 0 0 1px rgba(0,0,0,.9), 0 0 14px rgba(255,255,255,.12), inset 0 0 8px rgba(255,255,255,.06);
    display:grid; place-items:center; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; }
  .app:active { transform:scale(.9); }
  .app.on { box-shadow:0 0 0 1px rgba(0,0,0,.9), 0 0 24px rgba(255,255,255,.55); }
  .app svg { width:25px; height:25px; fill:none; stroke:var(--paper); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .ring { position:absolute; border-radius:50%; border:1px solid rgba(255,255,255,.07); pointer-events:none; }
  #label { position:absolute; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.38em; text-indent:.38em; text-transform:uppercase;
    opacity:0; transition:opacity .25s ease; pointer-events:none; }
  #label.show { opacity:.9; }
  .haci { position:absolute; left:50%; bottom:max(env(safe-area-inset-bottom),22px); transform:translateX(-50%); width:min(78vw,300px); height:44px;
    border-radius:22px; border:1px solid rgba(255,255,255,.35); background:rgba(8,8,8,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; align-items:center; gap:10px; padding:0 16px; font-size:12px; letter-spacing:.14em; color:rgba(255,255,255,.62); }
  .haci i { width:7px; height:7px; border-radius:50%; background:var(--paper); box-shadow:0 0 10px #fff; animation:pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="stage">
  <div class="clock"><div class="t" id="t">--:--</div><div class="d" id="d"></div></div>
  <div id="rings"></div>
  <div id="orbits"></div>
  <div id="label"></div>
  <div class="haci"><i></i><span>Hacı'ya sor</span></div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec2 uC;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+vec2(7.1,3.7); a*=.5; } return v; }

void main(){
  vec2 p = (gl_FragCoord.xy - uC*uRes) / uRes.y;
  float t = uTime;
  float R = 0.058;                 // event horizon
  float r = length(p);
  vec3 col = vec3(0.);

  // stars with twinkle
  vec2 sp = gl_FragCoord.xy / uRes.y * 46.;
  vec2 sid = floor(sp); float sh = hash(sid);
  vec2 sc = fract(sp) - .5 - (vec2(hash(sid+3.1), hash(sid+9.7))-.5)*.6;
  float star = smoothstep(.08*sh, 0., length(sc)) * step(.93, sh) * (.45+.55*sin(t*1.6+sh*40.));
  col += vec3(star) * .75;

  // lensing: bend sample space near the hole
  vec2 q = p;
  float bend = (R*R*2.6) / (r*r + 1e-4);
  q -= normalize(p) * bend * .5;

  // accretion disk (tilted ellipse), swirling bands
  vec2 e = vec2(q.x, q.y / .26);
  float d = length(e);
  float ang = atan(e.y, e.x);
  float rot = ang + t * .55 / (d*6.0 + .6);
  float bands = fbm(vec2(cos(rot), sin(rot))*2.4 + vec2(d*17. - t*.18, d*9.));
  float disk = smoothstep(.085, .12, d) * (1. - smoothstep(.15, .36, d));
  float dop = .45 + .7*cos(ang - 2.65);                 // brighter side
  float dv = disk * (.08 + 1.1*pow(bands, 1.6)) * max(dop, 0.) * (1.2 - d*2.8);
  // back half hidden by the hole (smooth, no seam)
  float fr = smoothstep(.012, -.012, e.y);
  float behind = smoothstep(R*1.08, R*1.4, r);
  dv *= mix(behind, 1., fr);
  col += vec3(dv) * .62;

  // lensed halo bent over the top and under the bottom
  float halo = exp(-pow((r - R*1.5)/ (R*.45), 2.));
  float pa = atan(p.y, p.x) + t*.35;
  float hv = halo * (.25 + .75 * fbm(vec2(cos(pa), sin(pa))*2.2 + vec2(r*40., 0.)));
  hv *= .35 + .65*abs(p.y)/(r+1e-4);
  col += vec3(hv) * .5;

  // photon ring, razor thin
  float ring = exp(-pow((r - R*1.1)/(R*.035), 2.));
  col += vec3(ring) * 1.25 * (.8 + .2*sin(ang*2. + t*.7));

  // soft outer glow
  col += vec3(.7) * exp(-(r-R)*9.) * .14 * step(R, r);
  col += vec3(.9) * exp(-(r-R)*30.) * .22 * step(R, r);

  // event horizon
  col *= smoothstep(R*.94, R*1.02, r);

  // film grain + vignette
  col += (hash(gl_FragCoord.xy + t) - .5) * .018;
  col *= 1. - smoothstep(.45, 1.05, length((gl_FragCoord.xy / uRes - .5) * vec2(uRes.x/uRes.y, 1.)));
  float g = clamp(dot(col, vec3(.333)), 0., 1.);
  g = pow(g, .92);
  gl_FragColor = vec4(vec3(g), 1.);
}
</script>

<script>
(function(){
  /* ---------- WebGL kara delik ---------- */
  var cv = document.getElementById('gl');
  var gl = cv.getContext('webgl', {antialias:false, powerPreference:'low-power'});
  var CY = 0.47;                       // delik merkezinin dikey konumu (alttan oran)
  function sh(type, id){ var s=gl.createShader(type); gl.shaderSource(s, document.getElementById(id).textContent); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER,'vs')); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER,'fs')); gl.linkProgram(pr); gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uRes = gl.getUniformLocation(pr,'uRes'), uTime = gl.getUniformLocation(pr,'uTime'), uC = gl.getUniformLocation(pr,'uC');
  var W=0,H=0, dpr=1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    var scale = 0.75;                  // pil ve akıcılık için biraz düşük çözünürlük
    cv.width = Math.round(W*dpr*scale); cv.height = Math.round(H*dpr*scale);
    gl.viewport(0,0,cv.width,cv.height);
    layout();
  }
  window.addEventListener('resize', resize);

  /* ---------- Yörünge ---------- */
  var ICON = {
    telefon:'<path d="M6 4h3l1.5 4-2 1.3a10 10 0 0 0 5.2 5.2L15 12.5l4 1.5v3a2 2 0 0 1-2 2A13 13 0 0 1 4 6a2 2 0 0 1 2-2z"/>',
    mesaj:'<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.5V16h-.0A2.5 2.5 0 0 1 4 13.5z"/>',
    safari:'<circle cx="12" cy="12" r="8.5"/><path d="M15.8 8.2l-2.2 5.4-5.4 2.2 2.2-5.4z"/>',
    kamera:'<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/>',
    foto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6-6M20.5 12H12l6 6M12 20.5V12l-6 6M3.5 12H12L6 6"/>',
    not:'<path d="M7 4h8l3 3v13H7z"/><path d="M10 10h5M10 13.5h5M10 17h3"/>',
    mail:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4.5 7.5l7.5 6 7.5-6"/>',
    harita:'<path d="M12 20s6-5.2 6-10a6 6 0 0 0-12 0c0 4.8 6 10 6 10z"/><circle cx="12" cy="10" r="2.2"/>',
    muzik:'<path d="M9 17.5V6l9-2v11.5"/><circle cx="7" cy="17.5" r="2.2"/><circle cx="16" cy="15.5" r="2.2"/>',
    ayar:'<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2L18 18M18 6l-1.8 1.8M7.8 16.2L6 18"/>',
    haci:'<path d="M5 19V5M19 19V5M5 12h14"/><circle cx="12" cy="12" r="1.4"/>',
    claude:'<path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6L6 18"/>'
  };
  var NAMES = {telefon:'Telefon',mesaj:'Mesajlar',safari:'Safari',kamera:'Kamera',foto:'Fotoğraflar',not:'Notlar',mail:'Mail',harita:'Haritalar',muzik:'Müzik',ayar:'Ayarlar',haci:'Hacı',claude:'Claude'};
  var RINGS = [
    { items:['haci','claude','kamera','safari','mesaj'], speed:.055, dir:1 },
    { items:['telefon','foto','not','mail','harita','muzik','ayar'], speed:.034, dir:-1 }
  ];
  var orbitsEl = document.getElementById('orbits'), ringsEl = document.getElementById('rings'), labelEl = document.getElementById('label');
  var nodes = [], radii = [];
  function build(){
    RINGS.forEach(function(rg, ri){
      var rEl = document.createElement('div'); rEl.className='ring'; ringsEl.appendChild(rEl); radii.push(rEl);
      rg.items.forEach(function(key, i){
        var el = document.createElement('div'); el.className='app'; el.dataset.k=key;
        el.innerHTML = '<svg viewBox="0 0 24 24">'+ICON[key]+'</svg>';
        el.addEventListener('click', function(){ pick(el, key); });
        orbitsEl.appendChild(el); nodes.push({el:el, ring:ri, i:i, n:rg.items.length});
      });
    });
  }
  var cx=0, cy=0, rad=[0,0];
  function layout(){
    cx = W/2; cy = H*(1-CY);
    var base = Math.min(W, H*.46);
    var maxR = W/2 - 32;                 // 25px ikon yarıçapı + 7px kenar payı: taşmaz
    var r2 = Math.min(base*.46, maxR);
    rad = [r2*.57, r2];                  // iki yörünge arası açıklık ikon boyunun ~1,3 katı
    radii.forEach(function(el, i){ var s=rad[i]*2; el.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(cx-rad[i])+'px;top:'+(cy-rad[i])+'px'; });
    labelEl.style.top = (cy + rad[1] + 40) + 'px';
  }
  var labelTimer=null;
  function pick(el, key){
    nodes.forEach(function(n){ n.el.classList.remove('on'); }); el.classList.add('on');
    labelEl.textContent = NAMES[key]; labelEl.classList.add('show');
    clearTimeout(labelTimer); labelTimer = setTimeout(function(){ labelEl.classList.remove('show'); el.classList.remove('on'); }, 1600);
    // Gerçek uygulamada burada yerel köprü çağrılır: bridge.open(key)
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.open){ window.webkit.messageHandlers.open.postMessage(key); }
  }

  /* ---------- Saat ---------- */
  var tEl=document.getElementById('t'), dEl=document.getElementById('d');
  function tick(){ var n=new Date(); tEl.textContent = ('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
    dEl.textContent = n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}); }
  tick(); setInterval(tick, 15000);

  /* ---------- Döngü ---------- */
  var t0 = performance.now(), reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){
    var t = (now - t0)/1000;
    gl.uniform2f(uRes, cv.width, cv.height); gl.uniform1f(uTime, reduce ? 0 : t); gl.uniform2f(uC, .5, CY);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    nodes.forEach(function(n){
      var rg = RINGS[n.ring];
      var a = (n.i / n.n) * Math.PI*2 + (n.ring ? Math.PI/ n.n : 0) - Math.PI/2;
      var x = cx + Math.cos(a)*rad[n.ring], y = cy + Math.sin(a)*rad[n.ring];
      n.el.style.left = x+'px'; n.el.style.top = y+'px';
    });
    requestAnimationFrame(frame);
  }
  build(); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
